[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mbet"
version = "0.1.0"
description = "Terminal client for a personal Marathonbet session. No bundled private API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "mbet" }]
dependencies = [
  "cryptography>=42",
  "httpx>=0.27",
  "keyring>=25",
  "pydantic>=2",
  "pyyaml>=6",
  "rich>=13",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mbet = "mbet.cli:main"

[tool.setuptools.packages.find]
include = ["mbet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
